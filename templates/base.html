<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Success Predictor{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='theme.css') }}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="theme-switcher">
        <button class="theme-btn" data-theme="light" onclick="themeToggle.setTheme('light')">
            <i class="fas fa-sun"></i> Light
        </button>
        <button class="theme-btn" data-theme="dark" onclick="themeToggle.setTheme('dark')">
            <i class="fas fa-moon"></i> Dark
        </button>
        <button class="theme-btn" data-theme="system" onclick="themeToggle.setTheme('system')">
            <i class="fas fa-desktop"></i> System
        </button>
    </div>

    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
